name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - 'infra/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-1
      SAM_STACK_NAME: youkai-collection-web

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::653334182577:role/github-actions-youkai-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM build
        run: sam build --template infra/template.yaml

      - name: SAM deploy
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM

      # MinimumCompressionSize のような RestApi 本体の設定は、ステージを再デプロイ
      # しないと反映されない。SAM はルート定義が変わらないと Deployment を作らない
      # ため、ここで明示的に打ち直す（変更が無い場合も冪等）。
      - name: Redeploy API stage
        run: |
          API_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='YokaiApiId'].OutputValue" \
            --output text)
          if [ -z "$API_ID" ] || [ "$API_ID" = "None" ]; then
            echo "YokaiApiId output が見つかりません" >&2
            exit 1
          fi
          aws apigateway create-deployment \
            --rest-api-id "$API_ID" \
            --stage-name prod \
            --region ${{ env.AWS_REGION }} \
            --description "CI ${{ github.sha }}"
